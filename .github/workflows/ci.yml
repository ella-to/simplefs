name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: make fmt
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: cross-vet
        run: sh scripts/cross-vet.sh
      - name: docker end-to-end
        run: make docker-test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: vet + test (cgo on)
        run: go vet ./... && go test -race ./...
      - name: vet + test (cgo off)
        env:
          CGO_ENABLED: "0"
        run: go vet ./... && go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
